# Weekly rebuild of seed → intersection ID cache for faster "Check intersections" runs.
# 21:00 UTC Fridays ≈ 23:00 Europe/Paris in summer (CEST); 22:00 Paris in winter (CET).
name: Build intersections cache

on:
  schedule:
    - cron: "0 21 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build intersections cache
        env:
          TOURN_CHECK_PARALLEL_WORKERS: "8"
        run: python build_intersections_cache.py -o data/intersections_cache.json

      - name: Commit cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intersections_cache.json
          if git diff --staged --quiet; then
            echo "No cache changes"
          else
            git commit -m "chore: refresh intersections cache"
            git push
          fi
